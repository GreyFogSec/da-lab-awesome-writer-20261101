name: PR Commands Writer

on:
  workflow_run:
    workflows: [PR Commands]
    types: [completed]

permissions:
  contents: read

jobs:
  run-command:
    if: >-
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download command request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-command-request
          path: ${{ runner.temp }}/pr-command-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout trusted authorization logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: eng

      - name: Safe control — revalidate live authorization
        id: safe
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUEST_PATH: ${{ runner.temp }}/pr-command-request/request.json
        with:
          script: |
            const fs = require('fs')
            const authorize = require('./eng/pr-commands.js')
            const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
            const result = await authorize({github, context, request})
            core.info(`Safe control: actor=${result.actor} permission=${result.permission} authorized=${result.authorized}`)
            core.setOutput('authorized', String(result.authorized))
            core.setOutput('pr_number', String(request.pr_number))

      - name: Assert external attacker was rejected by safe control
        run: test "${{ steps.safe.outputs.authorized }}" = "false"

      - name: Unsafe positive control — trust artifact and write to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUEST_PATH: ${{ runner.temp }}/pr-command-request/request.json
        with:
          script: |
            const fs = require('fs')
            const request = JSON.parse(fs.readFileSync(process.env.REQUEST_PATH, 'utf8'))
            const {data: created} = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: request.pr_number,
              body: `LAB POSITIVE CONTROL: privileged writer trusted artifact from run ${context.runId}.`,
            })
            core.info(`Created harmless evidence comment ${created.id}`)
